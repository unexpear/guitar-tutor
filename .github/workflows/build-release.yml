name: Build & Release Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Run Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Decode keystore
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.HAS_SIGNING_KEY == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Create keystore.properties
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "storeFile=release.keystore" >> android/keystore.properties

      - name: Patch build.gradle for release signing
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.HAS_SIGNING_KEY == 'true'
        run: |
          cd android/app
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' build.gradle
          sed -i '/buildTypes {/i\
          signingConfigs {\
              release {\
                  storeFile file("release.keystore")\
                  storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""\
                  keyAlias System.getenv("KEY_ALIAS") ?: ""\
                  keyPassword System.getenv("KEY_PASSWORD") ?: ""\
              }\
          }' build.gradle

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Play Store requires an Android App Bundle; the keystore acts as the
      # Play App Signing upload key. Same signing config as the APK.
      - name: Build release AAB (Play Store)
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.HAS_SIGNING_KEY == 'true'
        run: |
          cd android
          ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build debug APK (PRs)
        if: github.event_name == 'pull_request'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK output
        run: ls -la android/app/build/outputs/apk/release/ android/app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload release APK artifact (signed)
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB artifact
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Without signing secrets the APK carries the Android Debug certificate.
      # It is fine for sideloading but Play will reject it, so label it plainly
      # and never emit an AAB that looks uploadable.
      - name: Upload UNSIGNED release APK artifact
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-DEBUG-SIGNED-not-for-play
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Warn that signing secrets are missing
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::warning title=No signing key::KEYSTORE_BASE64 is not set, so this build is signed with the Android Debug certificate. No AAB was produced - Google Play rejects debug-signed uploads. See docs/KEYSTORE-CI.md."
          {
            echo "### :warning: Debug-signed build"
            echo ""
            echo "Signing secrets are not configured, so no Play-uploadable AAB was built."
            echo "Add \`KEYSTORE_BASE64\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\` and \`KEY_PASSWORD\`, then re-run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Uploads the signed bundle straight to the Play closed-testing track, so
  # the 80 MB+ AAB never has to be dragged into the console by hand.
  # Requires a Play Developer API service account JSON in the
  # PLAY_SERVICE_ACCOUNT_JSON secret (see docs/PLAY-SUBMISSION.md); without
  # it every step no-ops and the workflow still succeeds.
  publish:
    name: Upload to Play (closed testing)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Checkout repository
        if: env.HAS_PLAY_SA == 'true'
        uses: actions/checkout@v4

      - name: Download release AAB
        if: env.HAS_PLAY_SA == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: aab

      - name: Upload to Play closed testing track
        if: env.HAS_PLAY_SA == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.standardtune.guitar
          releaseFiles: aab/*.aab
          track: alpha
          # 'draft' stages the release for review in the console; switch to
          # 'completed' once you want tags to roll out to testers directly.
          status: draft
          whatsNewDirectory: distribution/whatsnew

      - name: Note when skipped
        if: env.HAS_PLAY_SA != 'true'
        run: echo "PLAY_SERVICE_ACCOUNT_JSON not set - skipping Play upload."
