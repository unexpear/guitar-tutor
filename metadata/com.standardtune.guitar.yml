Categories:
  - Multimedia
License: MIT
AuthorName: StandardTune
WebSite: https://github.com/unexpear/guitar-tutor
SourceCode: https://github.com/unexpear/guitar-tutor
IssueTracker: https://github.com/unexpear/guitar-tutor/issues

AutoName: StandardTune Guitar

RepoType: git
Repo: https://github.com/unexpear/guitar-tutor.git

Builds:
  - versionName: '1.0.0'
    versionCode: 4
    commit: v1.0.0-4
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
      - sysctl fs.inotify.max_user_watches=524288 || true
      - curl -Lo node.tar.gz https://nodejs.org/download/release/v20.19.3/node-v20.19.3-linux-x64.tar.gz
      - echo "0824828b9972e4c94654103a34a65c6e84be200a8f0f398a0c67f1a23e473076 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    init:
      - cd ../..
      - npm install --build-from-source
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npx expo prebuild -p android --clean
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/react-native-reanimated/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - android/build.gradle
    scandelete:
      - node_modules
    output: android/app/build/outputs/apk/release/app-release.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0.0'
CurrentVersionCode: 4
